<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | Professional URL Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ PhishGuard Pro</h1>
            <p>Advanced URL Threat Intelligence Tool</p>
        </header>

        <section class="input-section">
            <input type="text" id="urlInput" placeholder="Enter URL to analyze (e.g., secure-bank-login.com)...">
            <button onclick="checkURL()" id="checkBtn">Analyze URL</button>
        </section>

        <div id="loader" class="hidden">Analyzing via VirusTotal & AI Rules...</div>

        <section id="resultSection" class="result-card hidden">
            <div class="result-header">
                <div id="riskLevel" class="badge">Safe</div>
                <div class="score-box">
                    <span id="riskScore">0</span>
                    <label>Risk Score</label>
                </div>
            </div>
            
            <div class="issues-list">
                <h3>Detected Issues:</h3>
                <ul id="issuesList"></ul>
            </div>

            <!-- নতুন ডাউনলোড বাটন -->
            <div class="action-section">
                <button onclick="downloadReport()" id="downloadBtn" class="download-btn">📥 Download Analysis Report (JSON)</button>
            </div>
        </section>

        <section class="history-section">
            <h3>Recent Analysis History (from Database)</h3>
            <div id="historyList"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
